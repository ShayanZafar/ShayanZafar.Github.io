# CodeQL static analysis, free on public repositories: checks the site's
# JavaScript (inline scripts included) for DOM-based XSS and similar issues,
# with no model involved. Runs on pushes and pull requests to master, and
# weekly for new rules. Findings appear under Security > Code scanning.
name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "41 7 * * 2" # Tuesdays, 07:41 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
