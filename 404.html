<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Shayan Zafar Ahmad</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    .not-found { display: grid; place-content: center; min-height: 100vh; min-height: 100dvh; padding: 2rem var(--gutter); text-align: center; }
    .not-found .hero__name { margin-top: 1rem; font-size: clamp(2.5rem, 1.5rem + 4vw, 4rem); }
    .not-found p { margin-top: 1rem; color: var(--text-muted); }
    .not-found .btn { margin-top: 2rem; justify-self: center; }

<body>
  <main class="not-found">
    <p class="pill" style="justify-self:center">404</p>
    <h1 class="hero__name">Page not found</h1>

    <a class="btn btn--primary" href="/">Go to shayanzafar.github.io</a>
